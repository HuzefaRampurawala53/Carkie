workflows:
  android-build:
    name: Android Build
    instance_type: linux_default
    max_build_duration: 120
    environment:
      node: 22
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build APK
        script: |
          npx expo prebuild --clean
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk
    publishing:
      email:
        recipients:
          - $CODEMAGIC_BUILD_EMAIL